name: 自检

on:
  push:
    branches: [main]
  # 所有 PR 都跑，不限制目标分支。
  # 原来写的是 `branches: [main]`，于是**堆叠 PR**（base 指向另一个功能分支而不是 main）
  # 完全拿不到 CI —— 而堆叠恰恰是「两个 PR 改同一批文件、想避免合并冲突」时最该用的办法。
  # 结果是：为了躲开冲突而堆叠，代价是丢掉 CI，不划算。
  pull_request:
  workflow_dispatch:

# 同一个分支连续推送时，取消上一次还在跑的，省时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 编译 + 自检
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: |
          sw_vers
          swift --version

      # package.sh 串起了：生成图标 → 编译 → 跑自检 → 出 DMG/ZIP。
      # 这是在干净环境里唯一能同时验证「App 全部源码能编译」和「82 项自检通过」的方式。
      - name: 生成图标 + 编译 + 自检 + 打包
        run: ./package.sh

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: FaceCover-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: 上传图标预览
        uses: actions/upload-artifact@v4
        with:
          name: FaceCover-icon-preview
          path: dist/图标预览.png
          if-no-files-found: warn
          retention-days: 14

  windows-package:
    name: Windows 打包
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 上次移植（face_cover_x）的教训：不能只在 mac 上验证。Windows 侧每次提交
      # 都要在真实 Windows runner 上跑单元测试并打出安装包。
      - name: 安装依赖
        run: npm ci
        working-directory: windows

      - name: 单元测试（core 纯逻辑 36 条断言）
        run: npm test
        working-directory: windows

      - name: 打包 NSIS + ZIP
        run: npm run dist:win
        working-directory: windows

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: FaceCover-windows
          path: |
            windows/release/*-setup.exe
            windows/release/*.zip
          if-no-files-found: error
          retention-days: 14
